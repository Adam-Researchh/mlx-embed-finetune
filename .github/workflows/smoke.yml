name: smoke

# The repository's whole failure mode is silent drift: MLX, mlx-lm and
# mlx-embeddings move fast, and `LoRALinear` is imported from an internal
# mlx-lm path. This job exists to notice breakage without a human running it.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so upstream drift surfaces even when nobody touches the repo.
    - cron: "0 14 * * 1"
  workflow_dispatch:

jobs:
  retrieval-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: pip install numpy pytest
      - run: python -m pytest -q tests/test_retrieval.py tests/test_mining.py tests/test_benchmark.py

  smoke:
    # Apple Silicon runner for the Metal training and export integration tests.
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Regression tests
        run: python -m pytest -q

      - name: Record resolved versions
        run: pip list | grep -Ei "mlx|transformers|sentencepiece|numpy"

      - name: Dry run — unquantized encoder (LoRA)
        env:
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: |
          python train.py \
            --train-pairs example_data/train.jsonl \
            --model mlx-community/all-MiniLM-L6-v2-bf16 \
            --batch-size 4 --dry-run

      - name: Dry run — quantized encoder (QLoRA)
        env:
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: |
          python train.py \
            --train-pairs example_data/train.jsonl \
            --model mlx-community/all-MiniLM-L6-v2-4bit \
            --batch-size 4 --dry-run

      - name: Dry run — ModernBERT (different block structure, fused QKV)
        env:
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: |
          python train.py \
            --train-pairs example_data/train.jsonl \
            --model mlx-community/nomicai-modernbert-embed-base-bf16 \
            --batch-size 4 --dry-run

      - name: Dry run — decoder-style embedder (different forward signature)
        env:
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: |
          python train.py \
            --train-pairs example_data/train.jsonl \
            --model mlx-community/embeddinggemma-300m-4bit \
            --batch-size 2 --max-length 128 --dry-run

      - name: Dry run — all-linear targeting and instruction prefixes
        env:
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: |
          python train.py \
            --train-pairs example_data/train.jsonl \
            --model mlx-community/all-MiniLM-L6-v2-bf16 \
            --batch-size 4 --target-modules all-linear \
            --query-prefix "search_query: " --doc-prefix "search_document: " --dry-run

      - name: Dry run — Matryoshka loss
        env:
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: |
          python train.py \
            --train-pairs example_data/train.jsonl \
            --model mlx-community/all-MiniLM-L6-v2-bf16 \
            --batch-size 4 --matryoshka-dims 384,256,128,64 --dry-run

      - name: Full loop — train, evaluate, restore best, merge, export
        env:
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: |
          python train.py \
            --train-pairs example_data/train.jsonl \
            --eval-pairs example_data/eval.jsonl \
            --model mlx-community/all-MiniLM-L6-v2-bf16 \
            --epochs 2 --batch-size 4 --grad-accum-steps 2 \
            --eval-every 3 --log-every 3 --keep-checkpoints 2 \
            --best-metric ndcg_at_10 --hardness-strength 2 \
            --seed 42 --output-dir /tmp/ci-out
          test -f /tmp/ci-out/model.safetensors.index.json || test -f /tmp/ci-out/model.safetensors
          test -f /tmp/ci-out/best/adapters.safetensors
          test -f /tmp/ci-out/training_metadata.json
          python - <<'PY'
          import json
          meta = json.load(open("/tmp/ci-out/training_metadata.json"))
          assert "query_prefix" in meta and "doc_prefix" in meta, meta
          print("metadata records prefixes:", meta["query_prefix"], meta["doc_prefix"])
          PY

      - name: Evaluate exported model against its base
        env:
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: |
          python evaluate.py \
            --base-model mlx-community/all-MiniLM-L6-v2-bf16 \
            --tuned-model /tmp/ci-out \
            --eval-pairs example_data/eval.jsonl \
            --dims 128,64 --json-out /tmp/ci-eval.json
          test -f /tmp/ci-eval.json

      - name: Export parity — bf16 and QLoRA
        env:
          RUN_MODEL_TESTS: "1"
        run: python -m pytest -q tests/test_export.py

      - name: Mine negatives with an embedding teacher
        run: |
          python mine.py \
            --train-pairs example_data/train.jsonl \
            --model mlx-community/all-MiniLM-L6-v2-bf16 \
            --guide-model mlx-community/all-MiniLM-L6-v2-4bit \
            --num-negatives 3 --range-max 20 --output /tmp/ci-mined.jsonl
          python train.py \
            --train-pairs /tmp/ci-mined.jsonl \
            --model mlx-community/all-MiniLM-L6-v2-4bit \
            --batch-size 4 --hardness-strength 2 --dry-run

      - name: Guard — LoRA matching nothing must fail loudly
        env:
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: |
          if python train.py \
              --train-pairs example_data/train.jsonl \
              --model mlx-community/all-MiniLM-L6-v2-bf16 \
              --target-modules does_not_exist --dry-run; then
            echo "FAIL: zero adapted layers should be an error, not a silent no-op"
            exit 1
          fi
          echo "OK: zero adapted layers raised as expected"
